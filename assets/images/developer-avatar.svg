<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="50%" stop-color="#ede9fe" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="avatarBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
  </defs>

  <!-- Glowing outer circle -->
  <circle cx="200" cy="200" r="175" fill="url(#avatarGlow)" opacity="0.22" filter="url(#avatarBlur)" />
  
  <!-- Outer border circle -->
  <circle cx="200" cy="200" r="165" fill="url(#avatarBg)" stroke="url(#avatarGlow)" stroke-width="3.5" />

  <!-- Code symbols in background with elegant pastel opacity -->
  <text x="65" y="110" font-family="'Fira Code', monospace" font-size="20" font-weight="bold" fill="rgba(124, 58, 237, 0.45)">&lt;/&gt;</text>
  <text x="300" y="125" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="rgba(192, 132, 252, 0.6)">{ ... }</text>
  <text x="60" y="280" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" fill="rgba(147, 51, 234, 0.4)">#shopify</text>
  <text x="290" y="275" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" fill="rgba(168, 85, 247, 0.45)">wp_elem</text>

  <!-- Female Developer Vector Illustration -->
  <!-- Hair back -->
  <path d="M 130 180 C 120 95, 280 95, 270 180 C 270 240, 265 295, 250 315 C 235 325, 165 325, 150 315 C 135 295, 130 240, 130 180 Z" fill="#2d1b4e"/>

  <!-- Neck & Shoulders -->
  <path d="M 185 240 L 215 240 L 220 280 L 180 280 Z" fill="#f8cfb5" />
  
  <!-- Top / Hoodie -->
  <path d="M 130 350 C 130 285, 180 268, 200 268 C 220 268, 270 285, 270 350 Z" fill="url(#hoodieGrad)" />
  <path d="M 175 268 L 200 305 L 225 268 Z" fill="#6d28d9" />

  <!-- Head / Face -->
  <path d="M 155 165 C 155 130, 245 130, 245 165 C 245 210, 235 245, 200 245 C 165 245, 155 210, 155 165 Z" fill="#fde2d0" />
  
  <!-- Hair Front (Chic style) -->
  <path d="M 145 150 C 150 90, 250 90, 255 150 C 245 125, 220 120, 200 120 C 170 120, 150 135, 145 150 Z" fill="#3b2064" />
  <path d="M 148 140 C 140 180, 150 230, 155 240 C 160 220, 162 170, 158 150 Z" fill="#3b2064" />
  <path d="M 252 140 C 260 180, 250 230, 245 240 C 240 220, 238 170, 242 150 Z" fill="#3b2064" />

  <!-- Eyes & Eyebrows -->
  <path d="M 172 165 Q 180 160 188 165" stroke="#2d1b4e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="180" cy="173" r="3.5" fill="#2d1b4e"/>
  <circle cx="181.5" cy="171.5" r="1.2" fill="#ffffff"/>

  <path d="M 212 165 Q 220 160 228 165" stroke="#2d1b4e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="220" cy="173" r="3.5" fill="#2d1b4e"/>
  <circle cx="221.5" cy="171.5" r="1.2" fill="#ffffff"/>

  <!-- Glasses (Developer touch) -->
  <rect x="168" y="162" width="26" height="20" rx="5" fill="none" stroke="#7c3aed" stroke-width="2.5" />
  <rect x="206" y="162" width="26" height="20" rx="5" fill="none" stroke="#7c3aed" stroke-width="2.5" />
  <line x1="194" y1="172" x2="206" y2="172" stroke="#7c3aed" stroke-width="2" />

  <!-- Nose & Smile -->
  <path d="M 200 182 Q 198 190 200 193" stroke="#e0a98b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 190 206 Q 200 216 210 206" stroke="#db2777" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Headphones -->
  <path d="M 148 160 C 145 102, 255 102, 252 160" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <rect x="138" y="155" width="12" height="28" rx="6" fill="#c084fc" stroke="#7c3aed" stroke-width="2" />
  <rect x="250" y="155" width="12" height="28" rx="6" fill="#c084fc" stroke="#7c3aed" stroke-width="2" />

  <!-- Floating Badge on Avatar -->
  <rect x="105" y="325" width="190" height="38" rx="19" fill="#ffffff" stroke="url(#avatarGlow)" stroke-width="2" filter="drop-shadow(0 4px 10px rgba(124,58,237,0.25))" />
  <circle cx="128" cy="344" r="5" fill="#10b981"/>
  <text x="144" y="349" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2e1065">Sanjana Sharma</text>
</svg>
