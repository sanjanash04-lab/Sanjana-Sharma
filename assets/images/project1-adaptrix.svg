<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLightGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8ff" />
      <stop offset="50%" stop-color="#f5f2fe" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="softShadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.08" />
    </filter>
  </defs>
  
  <!-- Outer Light Canvas -->
  <rect width="800" height="500" fill="url(#bgLightGrad1)"/>
  
  <!-- Ambient Soft Orbs -->
  <circle cx="680" cy="120" r="160" fill="#c084fc" opacity="0.18" />
  <circle cx="120" cy="380" r="140" fill="#8b5cf6" opacity="0.12" />

  <!-- Browser Frame (Crisp Clean White with Soft Border) -->
  <rect x="45" y="35" width="710" height="430" rx="16" fill="#ffffff" stroke="rgba(124,58,237,0.18)" stroke-width="1.5" filter="url(#softShadow1)"/>
  
  <!-- Browser Header Bar -->
  <path d="M 45 51 Q 45 35 61 35 L 739 35 Q 755 35 755 51 L 755 82 L 45 82 Z" fill="#f8f6fc" />
  <line x1="45" y1="82" x2="755" y2="82" stroke="rgba(124,58,237,0.12)" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="72" cy="58" r="5.5" fill="#f87171" />
  <circle cx="92" cy="58" r="5.5" fill="#fbbf24" />
  <circle cx="112" cy="58" r="5.5" fill="#34d399" />
  
  <!-- URL Address Bar -->
  <rect x="145" y="47" width="510" height="24" rx="7" fill="#ffffff" stroke="rgba(124,58,237,0.15)"/>
  <circle cx="162" cy="59" r="3.5" fill="#10b981" />
  <text x="178" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#6d28d9">https://adaptrixai.com</text>

  <!-- Website Content Preview (Light & Clean) -->
  <rect x="85" y="112" width="150" height="24" rx="12" fill="#f3e8ff" />
  <text x="160" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">WordPress • Elementor Pro</text>

  <!-- Hero Section of Adaptrix -->
  <text x="85" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="29" font-weight="800" fill="#1e1b4b">Adaptrix <tspan fill="url(#purpleGrad)">AI Platform</tspan></text>
  <text x="85" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="500" fill="#64748b">Intelligent Automation &amp; Enterprise AI Solutions</text>
  
  <!-- Badges / CTA Buttons -->
  <rect x="85" y="222" width="135" height="36" rx="18" fill="url(#purpleGrad)" />
  <text x="152" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Explore Features</text>
  
  <rect x="232" y="222" width="125" height="36" rx="18" fill="#ffffff" stroke="rgba(124,58,237,0.25)" />
  <text x="294" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="600" fill="#7c3aed" text-anchor="middle">View Live Demo</text>

  <!-- 3 Clean Feature Cards inside Mockup -->
  <rect x="85" y="280" width="190" height="150" rx="14" fill="#faf8ff" stroke="rgba(124,58,237,0.12)" />
  <circle cx="120" cy="315" r="16" fill="#ede9fe" />
  <text x="120" y="320" font-family="sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">⚡</text>
  <text x="105" y="355" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1e1b4b">AI Automation</text>
  <text x="105" y="378" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#64748b">Smart workflow</text>
  <text x="105" y="396" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#64748b">pipelines &amp; sync</text>

  <rect x="295" y="280" width="190" height="150" rx="14" fill="#faf8ff" stroke="rgba(124,58,237,0.12)" />
  <circle cx="330" cy="315" r="16" fill="#fae8ff" />
  <text x="330" y="320" font-family="sans-serif" font-size="14" fill="#a855f7" text-anchor="middle">🧠</text>
  <text x="315" y="355" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1e1b4b">Neural Engine</text>
  <text x="315" y="378" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#64748b">Ultra low latency</text>
  <text x="315" y="396" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#64748b">enterprise stack</text>

  <rect x="505" y="280" width="190" height="150" rx="14" fill="#faf8ff" stroke="rgba(124,58,237,0.12)" />
  <circle cx="540" cy="315" r="16" fill="#ecfdf5" />
  <text x="540" y="320" font-family="sans-serif" font-size="14" fill="#10b981" text-anchor="middle">📊</text>
  <text x="525" y="355" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1e1b4b">Live Analytics</text>
  <text x="525" y="378" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#64748b">Interactive data</text>
  <text x="525" y="396" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#64748b">visual dashboards</text>
</svg>
