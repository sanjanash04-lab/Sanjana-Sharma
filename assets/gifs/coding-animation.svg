<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <style>
    @keyframes pulseCode {
      0%, 100% { opacity: 0.5; transform: scaleX(0.9); }
      50% { opacity: 1; transform: scaleX(1); }
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-24px) rotate(15deg); opacity: 0.2; }
    }
    .code-line-1 { animation: pulseCode 3s ease-in-out infinite; transform-origin: left; }
    .code-line-2 { animation: pulseCode 4s ease-in-out infinite 0.5s; transform-origin: left; }
    .code-cursor { animation: blinkCursor 0.9s infinite; }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite alternate; }
    .particle-2 { animation: floatParticle 6s ease-in-out infinite alternate 1.5s; }
  </style>

  <defs>
    <linearGradient id="bgDevLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="220" r="160" fill="url(#glowPurple)" opacity="0.12" filter="url(#softGlowLight)" />

  <!-- Code Workspace Card -->
  <rect x="50" y="30" width="500" height="380" rx="16" fill="url(#bgDevLight)" stroke="rgba(139,92,246,0.2)" stroke-width="1.5" filter="drop-shadow(0 12px 28px rgba(124,58,237,0.08))"/>

  <!-- Top Bar -->
  <rect x="50" y="30" width="500" height="42" rx="16" fill="#ede9fe" />
  <rect x="50" y="58" width="500" height="14" fill="#ede9fe" />
  <line x1="50" y1="72" x2="550" y2="72" stroke="rgba(139,92,246,0.15)" />

  <!-- Controls -->
  <circle cx="75" cy="51" r="5" fill="#f87171" />
  <circle cx="95" cy="51" r="5" fill="#fbbf24" />
  <circle cx="115" cy="51" r="5" fill="#34d399" />

  <text x="140" y="55" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#6d28d9">sanjana-developer.shopify.liquid</text>

  <!-- Code Line Numbers -->
  <g font-family="'Fira Code', monospace" font-size="11" fill="#9ca3af" text-anchor="end">
    <text x="85" y="110">01</text>
    <text x="85" y="135">02</text>
    <text x="85" y="160">03</text>
    <text x="85" y="185">04</text>
    <text x="85" y="210">05</text>
    <text x="85" y="235">06</text>
    <text x="85" y="260">07</text>
    <text x="85" y="285">08</text>
    <text x="85" y="310">09</text>
    <text x="85" y="335">10</text>
    <text x="85" y="360">11</text>
    <text x="85" y="385">12</text>
  </g>

  <!-- Code Syntax Content -->
  <g font-family="'Fira Code', monospace" font-size="12" fill="#1e1b4b">
    <text x="105" y="110"><tspan fill="#7c3aed" font-weight="600">const</tspan> <tspan fill="#2563eb">developer</tspan> = {</text>
    <text x="125" y="135"><tspan fill="#64748b">name:</tspan> <tspan fill="#059669">'Sanjana Sharma'</tspan>,</text>
    <text x="125" y="160"><tspan fill="#64748b">experience:</tspan> <tspan fill="#d97706">'5+ Years (4+ at Matebiz)'</tspan>,</text>
    <text x="125" y="185"><tspan fill="#64748b">specialties:</tspan> [</text>
    <text x="145" y="210" class="code-line-1"><tspan fill="#059669">'Shopify Liquid'</tspan>, <tspan fill="#059669">'WordPress Elementor'</tspan>,</text>
    <text x="145" y="235" class="code-line-2"><tspan fill="#059669">'HTML5/CSS3/JS'</tspan>, <tspan fill="#059669">'Bootstrap 5'</tspan></text>
    <text x="125" y="260">],</text>
    <text x="125" y="285"><tspan fill="#64748b">passion:</tspan> <tspan fill="#7c3aed">'Clean &amp; Elegant Digital Experiences'</tspan>,</text>
    <text x="125" y="310"><tspan fill="#64748b">status:</tspan> <tspan fill="#059669" font-weight="600">'Available for New Projects'</tspan></text>
    <text x="105" y="335">};</text>
    <text x="105" y="360"><tspan fill="#7c3aed">developer</tspan>.<tspan fill="#2563eb">buildExcellence</tspan>();<rect x="330" y="347" width="8" height="15" fill="#7c3aed" class="code-cursor"/></text>
    <text x="105" y="385" fill="#8b5cf6">// ✨ 100% Responsive &amp; Conversion-Focused</text>
  </g>

  <!-- Floating Particles -->
  <circle cx="500" cy="120" r="5" fill="#c084fc" class="particle-1" />
  <circle cx="470" cy="320" r="7" fill="#8b5cf6" class="particle-2" />
  <circle cx="100" cy="20" r="4" fill="#a855f7" class="particle-1" />
</svg>
